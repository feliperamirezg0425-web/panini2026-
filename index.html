    function toB64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
    }

    function getApiKey() { return localStorage.getItem("pan26_apikey") || ""; }
    function saveApiKey(k) { localStorage.setItem("pan26_apikey", k.trim()); }

    async function callClaude(messages) {
      const key = getApiKey();
      if (!key) throw new Error("No hay API key. Toca 🔑 para configurarla.");
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1500, messages }),
      });
      let d;
      try { d = await resp.json(); } catch { throw new Error("Error de red. Verifica tu conexion."); }
      if (!resp.ok) {
        const msg = d?.error?.message || "";
        if (resp.status === 401) throw new Error("API key invalida o revocada. Toca 🔑 para actualizarla.");
        if (resp.status === 429) throw new Error("Limite de uso alcanzado. Intenta en un momento.");
        throw new Error(msg || "Error " + resp.status);
      }
      const text = d.content?.[0]?.text;
      if (!text) throw new Error("Respuesta vacia de la API.");
      return text;
    }

    function Country({code, data, col, filter, onToggle}) {
      const [open, setOpen] = useState(false);
      const stickers = data.stickers;
      const owned = stickers.filter(s => col.o[s.id]).length;
      const rep = stickers.filter(s => col.r[s.id]).length;
      const pct = Math.round(owned / stickers.length * 100);
      const shown = stickers.filter(s => {
        if (filter === "missing") return !col.o[s.id] && !col.r[s.id];
        if (filter === "owned") return col.o[s.id];
        if (filter === "repeated") return col.r[s.id];
        return true;
      });
      if (filter !== "all" && shown.length === 0) return null;
      return (
        <div style={{marginBottom:8,borderRadius:10,overflow:"hidden",border:"1px solid #252840",background:"#15182a"}}>
          <div onClick={() => setOpen(v => !v)} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer",background:"#1c1f35",userSelect:"none"}}>

    function Scanner({onClose, onApply, col}) {
      const [img, setImg] = useState(null);

      const getInfo = (id) => {

        return null;
      };

      const PROMPT_STICKER = `You are reading the BACK of a loose Panini FIFA World Cup 2026 sticker.
The sticker code appears in the TOP RIGHT corner of the back, in a dark rounded rectangle.
Format examples: "SCO 11", "FWC 19", "MEX 7", "COL 3", "CC 4", "00"
IMPORTANT: In the app, codes use a dash instead of space: SCO-11, FWC-19, MEX-7, COL-3, CC-4, 00.
Read the code carefully and return ONLY a JSON array with that single code, converted to dash format.
Example: if you see "SCO 11" return ["SCO-11"]
If you see "00" return ["00"]
Return ONLY the JSON array, nothing else.`;

      const PROMPT_ALBUM = `You are analyzing a photo of a Panini FIFA World Cup 2026 sticker album page. The photo may be rotated or show two pages side by side — analyze it regardless of orientation.

HOW THIS ALBUM WORKS:
- Each sticker slot shows a country code + number printed inside it, e.g. "COL 7", "MEX 3", "FWC 2", "COL 13".
- The code is printed in WHITE TEXT on the ORANGE/COLORED background of the empty slot.
- The number appears LARGE in the slot, and the country code appears smaller above or near it.

YOUR JOB — classify every slot you can see:

MISSING (empty slot): The slot is empty and you can READ the code printed inside it.
→ Add to "missing" list.

OWNED (sticker glued): A player photo/image is covering the slot. You CANNOT see the code because it is hidden under the sticker.
→ Deduce the code from: the player name printed on the sticker, OR the sequential numbering of surrounding slots.
→ Add to "owned" list.

RULES:
- Codes format in output: use dash, e.g. COL-7, MEX-3, FWC-2, COL-13
- Country codes are 2-3 letters: COL, MEX, ARG, BRA, FRA, ESP, GER, ENG, POR, URU, CAN, USA, SCO, etc.

- Special intro stickers: FWC-1 through FWC-19, and "00" for the Panini logo
- Coca-Cola specials: CC-1 through CC-12
- Be thorough — scan the ENTIRE image including edges and corners
- If the photo shows two pages, analyze BOTH pages

Return ONLY a valid JSON object, nothing else:
{"owned": ["COL-4","COL-8","COL-10"], "missing": ["COL-2","COL-3","COL-5","COL-6","COL-7","COL-9"]}`;

      const analyze = async () => {

              {type:"text",text:prompt}
            ]}]);
            const clean = text.replace(/```json|```/g,"").trim();

            if (mode === "album") {
              let parsed = {owned:[], missing:[]};
              try { parsed = JSON.parse(clean); } catch {}
              const ownedValid = (parsed.owned||[]).map(id=>id.toUpperCase()).filter(id=>ALL_IDS.includes(id));

            } else {

                {preview ? (
                  <div style={{position:"relative",marginBottom:10}}>
                    <img src={preview} alt="" style={{width:"100%",borderRadius:8,maxHeight:180,objectFit:"contain",background:"#15182a"}} />
                    <button onClick={() => {setPreview(null);setImg(null);setResult(null);}} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:20,width:26,height:26,cursor:"pointer",fontSize:14}}>✕</button>
                  </div>
                ) : (
                  <button onClick={() => ref.current.click()} style={{width:"100%",padding:20,borderRadius:10,border:"2px dashed #252840",background:"#15182a",color:"#dde0ff",cursor:"pointer",fontSize:13,fontWeight:600,marginBottom:10}}>
                    🖼️ Seleccionar foto
                  </button>
                )}
              </>
            )}
            {mode==="manual" && (
              <textarea value={manual} onChange={e=>setManual(e.target.value)} placeholder={"MEX-1, ARG-17, FWC-9\nUno por linea o separados por coma"} style={{width:"100%",minHeight:80,borderRadius:8,border:"1px solid #252840",background:"#15182a",color:"#dde0ff",padding:10,fontSize:12,resize:"vertical",boxSizing:"border-box",marginBottom:10}} />
            )}
            <button onClick={analyze} disabled={loading||((mode==="photo"||mode==="album")&&!img)||(mode==="manual"&&!manual.trim())} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:"#4d6ef5",color:"#fff",fontWeight:800,fontSize:14,cursor:loading?"wait":"pointer",opacity:loading?0.7:1,marginBottom:12}}>
              {loading?"🔍 Analizando...":"🔍 Analizar"}
            </button>
            {result && !result.error && result.mode==="sticker" && (
              <div>
                <div style={{display:"flex",gap:12,fontSize:12,marginBottom:8,padding:10,background:"#15182a",borderRadius:8}}>
                  <span style={{color:"#3ecf8e"}}>✅ Nueva: {result.toAdd.length}</span>
                  <span style={{color:"#f5c842"}}>🔁 Repetida: {result.toRepeat.length}</span>
                  {result.invalid.length>0 && <span style={{color:"#5a6080"}}>❓ No reconocida: {result.invalid.length}</span>}
                </div>
                {result.toAdd.length>0 && (
                  <div style={{marginBottom:8}}>
                    <div style={{color:"#3ecf8e",fontWeight:700,fontSize:11,marginBottom:4}}>Nueva — la necesitas:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {result.toAdd.map(id => { const i=getInfo(id); return <span key={id} style={{background:"rgba(62,207,142,.12)",border:"1px solid #3ecf8e",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#dde0ff",fontWeight:700}}>{i?`${i.flag} ${id}`:id}</span>; })}
                    </div>
                  </div>
                )}
                {result.toRepeat.length>0 && (
                  <div style={{marginBottom:8}}>
                    <div style={{color:"#f5c842",fontWeight:700,fontSize:11,marginBottom:4}}>Repetida — ya la tienes:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {result.toRepeat.map(id => { const i=getInfo(id); return <span key={id} style={{background:"rgba(245,200,66,.12)",border:"1px solid #f5c842",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#dde0ff",fontWeight:700}}>{i?`${i.flag} ${id}`:id}</span>; })}
                    </div>
                  </div>
                )}
                <div style={{fontWeight:700,color:"#dde0ff",marginBottom:8,fontSize:13}}>Confirmas?</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={onClose} style={{flex:1,padding:10,borderRadius:8,border:"1px solid #252840",background:"#1c1f35",color:"#5a6080",cursor:"pointer",fontWeight:600}}>Cancelar</button>
                  <button onClick={() => onApply(result.toAdd, result.toRepeat)} style={{flex:2,padding:10,borderRadius:8,border:"none",background:"#3ecf8e",color:"#fff",cursor:"pointer",fontWeight:800,fontSize:14}}>✅ Registrar</button>
                </div>
              </div>
            )}
            {result && !result.error && result.mode==="album" && (
              <div>
                <div style={{display:"flex",gap:12,fontSize:12,marginBottom:8,padding:10,background:"#15182a",borderRadius:8,flexWrap:"wrap"}}>
                  <span style={{color:"#3ecf8e"}}>✅ Pegadas: {result.ownedValid.length}</span>
                  <span style={{color:"#ff6b6b"}}>◻️ Faltan: {result.missingValid.length}</span>
                  {result.toAdd.length>0 && <span style={{color:"#4d6ef5"}}>🆕 A registrar: {result.toAdd.length}</span>}
                </div>
                {result.missingValid.length>0 && (
                  <div style={{marginBottom:10}}>
                    <div style={{color:"#ff6b6b",fontWeight:700,fontSize:11,marginBottom:4}}>◻️ Faltan en esta página:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {result.missingValid.map(id => { const i=getInfo(id); return <span key={id} style={{background:"rgba(255,107,107,.1)",border:"1px solid #ff6b6b",borderRadius:6,padding:"3px 8px",fontSize:11,color:"#dde0ff"}}>{i?`${i.flag} ${id}`:id}</span>; })}
                    </div>
                  </div>
                )}
                {result.toAdd.length>0 && (
                  <div style={{marginBottom:10}}>
                    <div style={{color:"#3ecf8e",fontWeight:700,fontSize:11,marginBottom:4}}>🆕 Pegadas que no tenías registradas — se agregarán:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {result.toAdd.map(id => { const i=getInfo(id); return <span key={id} style={{background:"rgba(62,207,142,.12)",border:"1px solid #3ecf8e",borderRadius:6,padding:"3px 8px",fontSize:11,color:"#dde0ff"}}>{i?`${i.flag} ${id}`:id}</span>; })}
                    </div>
                  </div>
                )}
                {result.alreadyHad.length>0 && (
                  <div style={{marginBottom:10}}>
                    <div style={{color:"#5a6080",fontWeight:700,fontSize:11,marginBottom:4}}>✅ Ya estaban registradas:</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {result.alreadyHad.map(id => { const i=getInfo(id); return <span key={id} style={{background:"rgba(90,96,128,.1)",border:"1px solid #252840",borderRadius:6,padding:"3px 8px",fontSize:11,color:"#5a6080"}}>{i?`${i.flag} ${id}`:id}</span>; })}
                    </div>
                  </div>
                )}
                {result.toAdd.length>0 ? (
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={onClose} style={{flex:1,padding:10,borderRadius:8,border:"1px solid #252840",background:"#1c1f35",color:"#5a6080",cursor:"pointer",fontWeight:600}}>Cancelar</button>
                    <button onClick={() => onApply(result.toAdd, [])} style={{flex:2,padding:10,borderRadius:8,border:"none",background:"#3ecf8e",color:"#fff",cursor:"pointer",fontWeight:800,fontSize:14}}>✅ Registrar pegadas</button>
                  </div>
                ) : (
                  <button onClick={onClose} style={{width:"100%",padding:10,borderRadius:8,border:"none",background:"#1c1f35",color:"#dde0ff",cursor:"pointer",fontWeight:700}}>Cerrar</button>
                )}
              </div>
            )}
            {result?.error && <div style={{color:"#ff6b6b",background:"rgba(255,107,107,.1)",borderRadius:8,padding:10,fontSize:12}}>Error: {result.error}</div>}
            </>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [col, setCol] = useState(() => loadCol());
      const [filter, setFilter] = useState("all");
      const [search, setSearch] = useState("");
      const [showAI, setShowAI] = useState(false);
      const [toast, setToast] = useState(null);
      const [grp, setGrp] = useState("all");

      const showToast = (msg, type="ok") => { setToast({msg,type}); setTimeout(()=>setToast(null),2500); };

      const toggle = useCallback((id) => {
        setCol(prev => {
          const next = {o:{...prev.o}, r:{...prev.r}};
          if (next.o[id]) { delete next.o[id]; next.r[id]=true; showToast("🔁 Repetido","warn"); }
          else if (next.r[id]) { delete next.r[id]; showToast("❌ Quitado","err"); }
          else { next.o[id]=true; showToast("✅ Registrado!"); }
          saveCol(next);
          return next;
        });
      }, []);

      const applyAI = useCallback((toAdd, toRepeat) => {
        setCol(prev => {
          const next = {o:{...prev.o}, r:{...prev.r}};
          for (const id of toAdd) next.o[id]=true;
          for (const id of toRepeat) { delete next.o[id]; next.r[id]=true; }
          saveCol(next);
          return next;
        });
        showToast(`✅ ${toAdd.length} nuevos + ${toRepeat.length} repetidos`);
        setShowAI(false);
      }, []);

      const totalOwned = Object.keys(col.o).length;
      const totalRep = Object.keys(col.r).length;
      const pct = Math.round(totalOwned / TOTAL * 100);

      const visible = ORDER.filter(code => {
        const d = DB[code];
        if (!d) return false;
        if (search && !d.name.toLowerCase().includes(search.toLowerCase())) return false;
        if (grp !== "all" && d.group !== grp) return false;
        return true;
      });

      return (
        <div style={{fontFamily:"system-ui,sans-serif",background:"#0d1020",minHeight:"100vh"}}>
          <div style={{background:"#111425",borderBottom:"1px solid #252840",padding:"14px 14px 0",position:"sticky",top:0,zIndex:50}}>
            <div style={{maxWidth:860,margin:"0 auto"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <span style={{fontSize:26}}>⚽</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,color:"#dde0ff",fontSize:16}}>Panini WC 2026</div>
                  <div style={{color:"#5a6080",fontSize:11}}>Mi coleccion · {TOTAL} cromos</div>
                </div>
                <button onClick={() => setShowAI(true)} style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#4d6ef5",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>🤖 IA</button>
              </div>
              <div style={{background:"#1c1f35",borderRadius:4,height:6,marginBottom:7,overflow:"hidden"}}>
                <div style={{height:"100%",background:"linear-gradient(90deg,#4d6ef5,#3ecf8e)",width:`${pct}%`,transition:"width .4s"}} />
              </div>
              <div style={{display:"flex",gap:12,fontSize:11,marginBottom:8}}>
                <span style={{color:"#3ecf8e",fontWeight:700}}>✅ {totalOwned}</span>
                <span style={{color:"#5a6080"}}>◻️ {TOTAL-totalOwned} faltan</span>
                <span style={{color:"#f5c842"}}>🔁 {totalRep}</span>
                <span style={{marginLeft:"auto",color:"#4d6ef5",fontWeight:800,fontSize:14}}>{pct}%</span>
              </div>
              <div style={{display:"flex",gap:2,overflowX:"auto"}}>
                {[{k:"all",l:"Todos"},{k:"owned",l:"✅ Tengo"},{k:"missing",l:"◻️ Faltan"},{k:"repeated",l:"🔁 Repetidos"}].map(f => (
                  <button key={f.k} onClick={() => setFilter(f.k)} style={{padding:"7px 12px",border:"none",borderRadius:"7px 7px 0 0",whiteSpace:"nowrap",background:filter===f.k?"#15182a":"transparent",color:filter===f.k?"#dde0ff":"#5a6080",cursor:"pointer",fontWeight:filter===f.k?700:400,fontSize:11,borderBottom:filter===f.k?"2px solid #4d6ef5":"2px solid transparent"}}>
                    {f.l}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div style={{maxWidth:860,margin:"0 auto",padding:12}}>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar pais..." style={{flex:1,padding:"8px 12px",borderRadius:8,border:"1px solid #252840",background:"#15182a",color:"#dde0ff",fontSize:12}} />
              <select value={grp} onChange={e=>setGrp(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"1px solid #252840",background:"#15182a",color:"#dde0ff",fontSize:12,cursor:"pointer"}}>
                {["all","A","B","C","D","E","F","G","H","I","J","K","L"].map(g => <option key={g} value={g}>{g==="all"?"Todos los grupos":`Grupo ${g}`}</option>)}
              </select>
            </div>
            <div style={{fontSize:10.5,color:"#5a6080",marginBottom:8}}>💡 1 clic = ✅ tengo · 2 clics = 🔁 repetido · 3 clics = quitar</div>
            {visible.map(code => <Country key={code} code={code} data={DB[code]} col={col} filter={filter} onToggle={toggle} />)}
          </div>

          {showAI && <Scanner onClose={() => setShowAI(false)} onApply={applyAI} col={col} />}

          {toast && (
            <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:toast.type==="ok"?"#3ecf8e":toast.type==="warn"?"#b8920a":"#c0392b",color:"#fff",padding:"9px 20px",borderRadius:40,fontWeight:700,fontSize:12,zIndex:200,whiteSpace:"nowrap"}}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
